<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrustLayer — Analysis Validator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Tokens ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0b0d14;
      --surface:     #12151f;
      --surface2:    #1a1e2e;
      --border:      rgba(255,255,255,0.07);
      --border-hi:   rgba(255,255,255,0.14);
      --accent:      #6c63ff;
      --accent-glow: rgba(108,99,255,0.25);
      --cyan:        #22d3ee;
      --green:       #4ade80;
      --red:         #f87171;
      --amber:       #fbbf24;
      --text:        #e2e8f0;
      --muted:       #64748b;
      --radius:      12px;
      --shadow:      0 8px 32px rgba(0,0,0,0.5);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.6;
    }

    /* ── Layout ───────────────────────────────────────────────────────── */
    .app {
      display: grid;
      grid-template-rows: 56px 1fr;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Topbar ───────────────────────────────────────────────────────── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: relative;
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.3px;
    }
    .logo-icon {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, var(--accent), var(--cyan));
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .logo-badge {
      font-size: 10px;
      font-weight: 500;
      color: var(--muted);
      background: var(--surface2);
      padding: 2px 8px;
      border-radius: 20px;
      border: 1px solid var(--border);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    #model-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.4s;
    }
    .status-dot.ok    { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .status-dot.warn  { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
    .status-dot.error { background: var(--red);   box-shadow: 0 0 6px var(--red); }

    /* ── Main split ───────────────────────────────────────────────────── */
    .main {
      display: grid;
      grid-template-columns: 420px 1fr;
      overflow: hidden;
    }

    /* ── Left panel ───────────────────────────────────────────────────── */
    .left {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px;
      gap: 20px;
      overflow-y: auto;
    }

    h2.panel-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Tabs ─────────────────────────────────────────────────────────── */
    .tabs {
      display: flex;
      background: var(--surface2);
      border-radius: 9px;
      padding: 3px;
      gap: 3px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 7px 0;
      border-radius: 7px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      transition: all 0.2s;
      user-select: none;
    }
    .tab.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }
    .tab:not(.active):hover { color: var(--text); }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Drop zone ────────────────────────────────────────────────────── */
    .dropzone {
      border: 2px dashed var(--border-hi);
      border-radius: var(--radius);
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s;
      background: var(--surface2);
      position: relative;
    }
    .dropzone:hover, .dropzone.drag-over {
      border-color: var(--accent);
      background: rgba(108,99,255,0.07);
      box-shadow: 0 0 0 4px var(--accent-glow);
    }
    .dropzone input[type=file] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }
    .drop-icon { font-size: 36px; margin-bottom: 10px; }
    .drop-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .drop-sub { font-size: 12px; color: var(--muted); }

    /* File list */
    #file-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }
    .file-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      animation: fadeIn 0.2s ease;
    }
    .file-chip-icon { font-size: 18px; }
    .file-chip-name {
      flex: 1;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-chip-size { color: var(--muted); flex-shrink: 0; }
    .file-chip-remove {
      cursor: pointer;
      color: var(--muted);
      font-size: 16px;
      line-height: 1;
      transition: color 0.2s;
    }
    .file-chip-remove:hover { color: var(--red); }

    /* ── URL tab ──────────────────────────────────────────────────────── */
    .url-form { display: flex; flex-direction: column; gap: 12px; }
    .url-form label { font-size: 12px; color: var(--muted); font-weight: 500; }
    .url-form input[type=url] {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border-hi);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .url-form input[type=url]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .url-form input[type=url]::placeholder { color: var(--muted); }

    /* ── API base URL ─────────────────────────────────────────────────── */
    .api-config {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
    }
    .api-config label { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; }
    .api-config input {
      width: 100%;
      margin-top: 6px;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border-hi);
      color: var(--cyan);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      padding: 4px 0;
      outline: none;
    }

    /* ── Buttons ──────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 20px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      width: 100%;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      color: #fff;
      box-shadow: 0 4px 16px var(--accent-glow);
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px var(--accent-glow);
    }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    .btn-ghost {
      background: var(--surface2);
      border: 1px solid var(--border-hi);
      color: var(--text);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Spinner ──────────────────────────────────────────────────────── */
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .spinner.active { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Right panel ──────────────────────────────────────────────────── */
    .right {
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── Empty state ──────────────────────────────────────────────────── */
    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      text-align: center;
      gap: 12px;
    }
    .empty-icon { font-size: 48px; opacity: 0.4; }
    .empty-title { font-size: 16px; font-weight: 600; color: var(--text); opacity: 0.5; }
    .empty-sub { font-size: 13px; max-width: 300px; }

    /* ── Artifact card ────────────────────────────────────────────────── */
    .artifact-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      animation: fadeIn 0.3s ease;
      transition: border-color 0.2s;
    }
    .artifact-card:hover { border-color: var(--border-hi); }

    .artifact-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
    }
    .artifact-type-icon { font-size: 22px; }
    .artifact-name {
      flex: 1;
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .artifact-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      background: var(--bg);
      padding: 3px 8px;
      border-radius: 5px;
    }
    .artifact-mime {
      font-size: 11px;
      color: var(--muted);
    }

    .artifact-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }

    /* ── Evidence section header ──────────────────────────────────────── */
    .ev-section-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ev-count-badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 10px;
    }

    /* ── Manipulation pill ────────────────────────────────────────────── */
    .manip-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface2);
      border-radius: 10px;
      padding: 12px 14px;
      border: 1px solid var(--border);
    }
    .manip-icon { font-size: 18px; flex-shrink: 0; }
    .manip-info { flex: 1; }
    .manip-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 6px;
    }
    .manip-bar-wrap {
      background: rgba(255,255,255,0.06);
      border-radius: 4px;
      height: 5px;
      overflow: hidden;
    }
    .manip-bar {
      height: 100%;
      border-radius: 4px;
      transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
    }
    .manip-confidence {
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
      min-width: 44px;
      text-align: right;
    }
    .manip-detail {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── Person badges ────────────────────────────────────────────────── */
    .persons-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .person-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      min-width: 120px;
      transition: border-color 0.2s;
    }
    .person-card:hover { border-color: var(--accent); }
    .person-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .person-attrs { font-size: 11px; color: var(--muted); line-height: 1.8; }
    .person-conf { font-size: 10px; color: var(--muted); margin-top: 4px; }

    /* ── Metadata accordion ───────────────────────────────────────────── */
    .meta-accordion {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .meta-accordion-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      cursor: pointer;
      user-select: none;
      font-size: 12px;
      font-weight: 500;
    }
    .meta-accordion-header:hover { background: rgba(255,255,255,0.04); }
    .meta-chevron {
      font-size: 10px;
      color: var(--muted);
      transition: transform 0.2s;
    }
    .meta-accordion.open .meta-chevron { transform: rotate(180deg); }
    .meta-accordion-body {
      display: none;
      padding: 0 14px 12px;
      border-top: 1px solid var(--border);
    }
    .meta-accordion.open .meta-accordion-body { display: block; }
    .meta-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    .meta-table td {
      padding: 4px 0;
      font-size: 11px;
      vertical-align: top;
    }
    .meta-table td:first-child {
      color: var(--muted);
      width: 40%;
      font-family: 'JetBrains Mono', monospace;
      padding-right: 12px;
    }
    .meta-table td:last-child {
      font-family: 'JetBrains Mono', monospace;
      word-break: break-all;
    }

    /* ── Errors ───────────────────────────────────────────────────────── */
    .errors-box {
      background: rgba(248,113,113,0.08);
      border: 1px solid rgba(248,113,113,0.2);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--red);
      line-height: 1.8;
    }

    /* ── Raw JSON toggle ──────────────────────────────────────────────── */
    .raw-json-toggle {
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      text-align: right;
      user-select: none;
      transition: color 0.2s;
    }
    .raw-json-toggle:hover { color: var(--cyan); }
    .raw-json {
      display: none;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--cyan);
      max-height: 300px;
      overflow-y: auto;
      margin-top: 6px;
    }

    /* ── Global error banner ──────────────────────────────────────────── */
    #error-banner {
      display: none;
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.3);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      color: var(--red);
      animation: fadeIn 0.3s;
    }

    /* ── Summary bar ──────────────────────────────────────────────────── */
    #summary-bar {
      display: none;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .summary-stat { text-align: center; }
    .summary-num { font-size: 22px; font-weight: 700; color: var(--text); }
    .summary-label { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .summary-divider {
      width: 1px;
      height: 32px;
      background: var(--border);
    }

    /* ── Animations ───────────────────────────────────────────────────── */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Scrollbars ───────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  </style>
</head>
<body>

<div class="app">

  <!-- ── Topbar ─────────────────────────────────────────────────────────── -->
  <header class="topbar">
    <div class="logo">
      <div class="logo-icon">🔍</div>
      TrustLayer
      <span class="logo-badge">Validator</span>
    </div>
    <div id="model-status">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Checking models…</span>
    </div>
  </header>

  <!-- ── Main ───────────────────────────────────────────────────────────── -->
  <div class="main">

    <!-- Left: Input ──────────────────────────────────────────────────────── -->
    <aside class="left">

      <h2 class="panel-title">Input</h2>

      <!-- Tabs -->
      <div class="tabs">
        <div class="tab active" id="tab-file" onclick="switchTab('file')">📁 File Upload</div>
        <div class="tab" id="tab-url" onclick="switchTab('url')">🔗 URL</div>
      </div>

      <!-- File tab -->
      <div class="tab-panel active" id="panel-file">
        <div class="dropzone" id="dropzone"
             ondragover="handleDragOver(event)"
             ondragleave="handleDragLeave(event)"
             ondrop="handleDrop(event)">
          <input type="file" id="file-input" multiple
                 accept="image/*,video/*"
                 onchange="handleFileInput(event)" />
          <div class="drop-icon">🖼️</div>
          <div class="drop-title">Drop files here</div>
          <div class="drop-sub">or click to browse<br/>Images &amp; videos (JPG, PNG, MP4, MOV…)</div>
        </div>
        <div id="file-list"></div>
      </div>

      <!-- URL tab -->
      <div class="tab-panel" id="panel-url">
        <div class="url-form">
          <label for="url-input">Public image or video URL</label>
          <input type="url" id="url-input"
                 placeholder="https://example.com/photo.jpg"
                 autocomplete="off" />
          <div style="font-size:11px;color:var(--muted)">
            Direct link to JPG, PNG, MP4, MOV, etc.
          </div>
        </div>
      </div>

      <!-- API config -->
      <div class="api-config">
        <label>API Base URL</label>
        <input type="text" id="api-base" value="http://localhost:8000" />
      </div>

      <!-- Actions -->
      <button class="btn btn-primary" id="analyze-btn" onclick="runAnalysis()" disabled>
        <span class="spinner" id="btn-spinner"></span>
        <span id="btn-label">🔎 Analyze</span>
      </button>
      <button class="btn btn-ghost" onclick="loadMock()">🗂 Load Mock Evidence</button>
      <button class="btn btn-ghost" onclick="clearResults()">✕ Clear</button>

    </aside>

    <!-- Right: Results ───────────────────────────────────────────────────── -->
    <main class="right" id="results-panel">

      <div id="error-banner"></div>

      <div id="empty-state">
        <div class="empty-icon">📡</div>
        <div class="empty-title">No results yet</div>
        <div class="empty-sub">Upload files or paste a URL, then click Analyze to see Evidence JSON visualized here.</div>
      </div>

      <div id="summary-bar" style="display:none"></div>
      <div id="artifacts-container"></div>

    </main>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let selectedFiles = [];
let currentTab = 'file';

// ── Init ───────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  checkModelStatus();
  setInterval(checkModelStatus, 15000);
});

// ── Model status ───────────────────────────────────────────────────────────
async function checkModelStatus() {
  const base = document.getElementById('api-base').value.trim();
  const dot  = document.getElementById('status-dot');
  const text = document.getElementById('status-text');
  try {
    const res = await fetch(`${base}/health`, { signal: AbortSignal.timeout(4000) });
    const data = await res.json();
    const models = data.models || {};
    const loaded = Object.values(models).filter(Boolean).length;
    const total  = Object.keys(models).length;
    if (loaded === total && total > 0) {
      dot.className = 'status-dot ok';
      text.textContent = `All ${total} models ready`;
    } else if (loaded > 0) {
      dot.className = 'status-dot warn';
      text.textContent = `${loaded}/${total} models loaded`;
    } else {
      dot.className = 'status-dot warn';
      text.textContent = 'Backend up, models loading…';
    }
  } catch {
    dot.className = 'status-dot error';
    text.textContent = 'Backend unreachable';
  }
}

// ── Tab switching ──────────────────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById(`tab-${tab}`).classList.add('active');
  document.getElementById(`panel-${tab}`).classList.add('active');
  updateAnalyzeBtn();
}

// ── File handling ──────────────────────────────────────────────────────────
function handleDragOver(e) {
  e.preventDefault();
  document.getElementById('dropzone').classList.add('drag-over');
}
function handleDragLeave() {
  document.getElementById('dropzone').classList.remove('drag-over');
}
function handleDrop(e) {
  e.preventDefault();
  document.getElementById('dropzone').classList.remove('drag-over');
  addFiles([...e.dataTransfer.files]);
}
function handleFileInput(e) {
  addFiles([...e.target.files]);
}

function addFiles(files) {
  files.forEach(f => {
    if (!selectedFiles.find(x => x.name === f.name && x.size === f.size)) {
      selectedFiles.push(f);
    }
  });
  renderFileList();
  updateAnalyzeBtn();
}

function removeFile(index) {
  selectedFiles.splice(index, 1);
  renderFileList();
  updateAnalyzeBtn();
}

function renderFileList() {
  const list = document.getElementById('file-list');
  list.innerHTML = selectedFiles.map((f, i) => `
    <div class="file-chip">
      <span class="file-chip-icon">${fileIcon(f.name)}</span>
      <span class="file-chip-name">${escHtml(f.name)}</span>
      <span class="file-chip-size">${fmtSize(f.size)}</span>
      <span class="file-chip-remove" onclick="removeFile(${i})" title="Remove">×</span>
    </div>
  `).join('');
}

function fileIcon(name) {
  const ext = name.split('.').pop().toLowerCase();
  if (['mp4','mov','avi','webm','mkv'].includes(ext)) return '🎥';
  if (['jpg','jpeg','png','webp','bmp','tiff'].includes(ext)) return '🖼️';
  return '📄';
}

function updateAnalyzeBtn() {
  const btn = document.getElementById('analyze-btn');
  if (currentTab === 'file') {
    btn.disabled = selectedFiles.length === 0;
  } else {
    const url = document.getElementById('url-input').value.trim();
    btn.disabled = !url.startsWith('http');
  }
}

document.getElementById('url-input').addEventListener('input', updateAnalyzeBtn);

// ── Analysis ───────────────────────────────────────────────────────────────
async function runAnalysis() {
  const base = document.getElementById('api-base').value.trim();
  setLoading(true);
  hideError();

  try {
    let data;
    if (currentTab === 'file') {
      const fd = new FormData();
      selectedFiles.forEach(f => fd.append('files', f));
      const res = await fetch(`${base}/analyze/`, { method: 'POST', body: fd });
      if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
      data = await res.json();
      if (!Array.isArray(data)) data = [data];
    } else {
      const url = document.getElementById('url-input').value.trim();
      const fd = new FormData();
      fd.append('url', url);
      const res = await fetch(`${base}/analyze/url`, { method: 'POST', body: fd });
      if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
      data = [await res.json()];
    }
    renderResults(data);
  } catch (err) {
    showError(err.message);
  } finally {
    setLoading(false);
  }
}

async function loadMock() {
  const base = document.getElementById('api-base').value.trim();
  setLoading(true);
  hideError();
  try {
    const res = await fetch(`${base}/analyze/mock`, { method: 'POST' });
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
    const data = await res.json();
    renderResults(Array.isArray(data) ? data : [data]);
  } catch (err) {
    showError(err.message);
  } finally {
    setLoading(false);
  }
}

function clearResults() {
  selectedFiles = [];
  renderFileList();
  updateAnalyzeBtn();
  document.getElementById('url-input').value = '';
  document.getElementById('file-input').value = '';
  document.getElementById('artifacts-container').innerHTML = '';
  document.getElementById('summary-bar').style.display = 'none';
  document.getElementById('empty-state').style.display = 'flex';
  hideError();
}

// ── Render ─────────────────────────────────────────────────────────────────
function renderResults(artifacts) {
  document.getElementById('empty-state').style.display = 'none';
  const container = document.getElementById('artifacts-container');
  container.innerHTML = '';

  // Summary bar
  const totalEv = artifacts.reduce((s, a) => s + a.evidence.length, 0);
  const synthetic = artifacts.filter(a =>
    a.evidence.some(e => e.type === 'manipulation' && e.value === 'synthetic_visual'));
  const persons = new Set(
    artifacts.flatMap(a =>
      a.evidence.filter(e => e.type === 'person').map(e => e.value?.person_id)
    ).filter(Boolean)
  );

  const bar = document.getElementById('summary-bar');
  bar.style.display = 'flex';
  bar.innerHTML = `
    <div class="summary-stat">
      <div class="summary-num">${artifacts.length}</div>
      <div class="summary-label">Artifacts</div>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-stat">
      <div class="summary-num">${totalEv}</div>
      <div class="summary-label">Evidence items</div>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-stat">
      <div class="summary-num" style="color:var(--accent)">${persons.size}</div>
      <div class="summary-label">Unique persons</div>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-stat">
      <div class="summary-num" style="color:${synthetic.length > 0 ? 'var(--red)' : 'var(--green)'}">${synthetic.length}</div>
      <div class="summary-label">Synthetic flags</div>
    </div>
  `;

  artifacts.forEach(a => {
    container.appendChild(buildArtifactCard(a));
  });
}

function buildArtifactCard(artifact) {
  const div = document.createElement('div');
  div.className = 'artifact-card';

  const manips  = artifact.evidence.filter(e => e.type === 'manipulation');
  const persons = artifact.evidence.filter(e => e.type === 'person');
  const metas   = artifact.evidence.filter(e => e.type === 'metadata');

  div.innerHTML = `
    <!-- Header -->
    <div class="artifact-header">
      <span class="artifact-type-icon">${typeIcon(artifact.type)}</span>
      <span class="artifact-name" title="${escHtml(artifact.filename)}">${escHtml(artifact.filename)}</span>
      <span class="artifact-mime">${escHtml(artifact.mime_type || '')}</span>
      <span class="artifact-id">${escHtml(artifact.artifact_id)}</span>
    </div>

    <!-- Body -->
    <div class="artifact-body">

      ${manips.length ? `
      <div>
        <div class="ev-section-title">⚠️ Manipulation Signals <span class="ev-count-badge">${manips.length}</span></div>
        ${manips.map(m => buildManipRow(m)).join('')}
      </div>` : `
      <div style="font-size:12px;color:var(--green)">✅ No manipulation signals detected</div>
      `}

      ${persons.length ? `
      <div>
        <div class="ev-section-title">👤 Persons Detected <span class="ev-count-badge">${persons.length}</span></div>
        <div class="persons-grid">
          ${persons.map(p => buildPersonCard(p)).join('')}
        </div>
      </div>` : ''}

      ${metas.length ? `
      <div>
        ${metas.map((m, i) => buildMetaAccordion(m, i)).join('')}
      </div>` : ''}

      ${artifact.analysis_errors?.length ? `
      <div>
        <div class="ev-section-title">⛔ Analysis Errors</div>
        <div class="errors-box">${artifact.analysis_errors.map(escHtml).join('\n')}</div>
      </div>` : ''}

      <!-- Raw JSON -->
      <div>
        <div class="raw-json-toggle" onclick="toggleRaw(this)">{ } Show raw JSON ▾</div>
        <pre class="raw-json">${escHtml(JSON.stringify(artifact, null, 2))}</pre>
      </div>

    </div>
  `;
  return div;
}

function buildManipRow(ev) {
  const value = typeof ev.value === 'string' ? ev.value : JSON.stringify(ev.value);
  const conf  = Math.round((ev.confidence || 0) * 100);
  const isBad = value.includes('synthetic') || value.includes('editing_software') || value.includes('mismatch');
  const color = isBad ? 'var(--red)' : (value.includes('authentic') ? 'var(--green)' : 'var(--amber)');
  const icon  = isBad ? '🔴' : (value.includes('authentic') ? '🟢' : '🟡');

  const detail = ev.detail ? `
    <div class="manip-detail">
      Frames flagged: ${ev.detail.frames_flagged} / ${ev.detail.frames_analyzed} &nbsp;|&nbsp;
      Avg: ${(ev.detail.avg_confidence * 100).toFixed(1)}% &nbsp;|&nbsp;
      Peak: ${(ev.detail.peak_confidence * 100).toFixed(1)}%
    </div>` : '';

  const ts = ev.frame_timestamp != null
    ? `<div class="manip-detail">Frame @ ${ev.frame_timestamp}s</div>` : '';

  return `
    <div class="manip-row">
      <span class="manip-icon">${icon}</span>
      <div class="manip-info">
        <div class="manip-value" style="color:${color}">${escHtml(value)}</div>
        <div class="manip-bar-wrap">
          <div class="manip-bar" style="width:${conf}%;background:${color}"></div>
        </div>
        ${detail}${ts}
        <div style="font-size:10px;color:var(--muted);margin-top:4px">${escHtml(ev.source_model || '')}</div>
      </div>
      <div class="manip-confidence" style="color:${color}">${conf}%</div>
    </div>`;
}

function buildPersonCard(ev) {
  const v   = ev.value || {};
  const pid = v.person_id || `face_${v.face_index ?? '?'}`;
  const conf = Math.round((ev.confidence || 0) * 100);
  const ts  = ev.frame_timestamp != null ? `<div class="person-conf">@ ${ev.frame_timestamp}s</div>` : '';
  return `
    <div class="person-card">
      <div class="person-id">${escHtml(pid)}</div>
      <div class="person-attrs">
        ${v.age   ? `Age: ${v.age}<br/>` : ''}
        ${v.gender != null ? `Gender: ${v.gender === 1 ? 'M' : v.gender === 0 ? 'F' : v.gender}<br/>` : ''}
        ${v.bbox  ? `Bbox: [${v.bbox.join(', ')}]<br/>` : ''}
      </div>
      <div class="person-conf">Det: ${conf}%</div>
      ${ts}
    </div>`;
}

function buildMetaAccordion(ev, i) {
  const meta = ev.value || {};
  const rows = Object.entries(meta)
    .filter(([, v]) => v !== null && v !== undefined)
    .map(([k, v]) => `<tr><td>${escHtml(k)}</td><td>${escHtml(String(v))}</td></tr>`)
    .join('');

  return `
    <div class="meta-accordion" id="meta-acc-${i}" onclick="toggleAccordion('meta-acc-${i}')">
      <div class="meta-accordion-header">
        📋 Metadata
        <span class="meta-chevron">▾</span>
      </div>
      <div class="meta-accordion-body">
        <table class="meta-table"><tbody>${rows}</tbody></table>
      </div>
    </div>`;
}

// ── UI helpers ─────────────────────────────────────────────────────────────
function toggleAccordion(id) {
  document.getElementById(id).classList.toggle('open');
}

function toggleRaw(btn) {
  const pre = btn.nextElementSibling;
  const open = pre.style.display === 'block';
  pre.style.display = open ? 'none' : 'block';
  btn.textContent = open ? '{ } Show raw JSON ▾' : '{ } Hide raw JSON ▴';
}

function setLoading(on) {
  const btn   = document.getElementById('analyze-btn');
  const spin  = document.getElementById('btn-spinner');
  const label = document.getElementById('btn-label');
  btn.disabled = on;
  spin.classList.toggle('active', on);
  label.textContent = on ? 'Analyzing…' : '🔎 Analyze';
}

function showError(msg) {
  const b = document.getElementById('error-banner');
  b.textContent = `❌ ${msg}`;
  b.style.display = 'block';
}
function hideError() {
  document.getElementById('error-banner').style.display = 'none';
}

function typeIcon(type) {
  return { image: '🖼️', video: '🎥', audio: '🎵', document: '📄' }[type] || '📦';
}

function fmtSize(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1048576) return `${(bytes/1024).toFixed(1)} KB`;
  return `${(bytes/1048576).toFixed(1)} MB`;
}

function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
